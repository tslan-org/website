	<body class="no-sidebar is-preload">
		<div id="page-wrapper">

			<!-- Header -->

					<div class="container">

						<!-- Logo -->
							<h1 id="logo"><a href="index.html">Profiles</a></h1>
							<p><span class="brand">tsLAN</span> Profile Specifications</p>

						<!-- Nav -->
							<nav id="nav">
								<ul>
									<li><a class="icon icon-tslan" href="index.html"><span class="brand">tsLAN</span></a></li>
									<li><a class="icon solid fa-clipboard-list" href="profiles.html"><span>Profiles</span></a></li>
									<li><a class="icon solid fa-terminal" href="tools.html"><span>CLI Tools</span></a></li>

							</nav>

			<!-- Main -->
				<section id="main">
					<div class="container">
						<div id="content">

							<!-- Post -->
								<article class="box post">
									<header>
										<nav id="profile-nav">
											<a href="#audio_basic" class="profile-tab active" data-group="audio">Audio</a>
											<a href="#video_basic" class="profile-tab" data-group="video">Video</a>
											<a href="#avb_lite" class="profile-tab" data-file="avb_lite.md">AVB Lite</a>
											<a href="#avb_wireless" class="profile-tab" data-file="avb_wireless.md">AVB Wireless</a>
											<a href="#voice_assistant" class="profile-tab" data-file="voice_assistant.md">Voice Assistant</a>
											<a href="#robotics" class="profile-tab" data-group="robotics">Robotics</a>
										</nav>
										<nav id="profile-levels"></nav>
									</header>

									<section id="profile-content">

									</section>

<!-- Footer -->

		<!-- Scripts -->
			<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.dropotron.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>
			<script src="assets/js/brand.js"></script>
			<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
			<script>
				var baseUrl = 'https://raw.githubusercontent.com/tslan-org/profiles/refs/heads/main/';

				function loadProfile(filename) {
					document.getElementById('profile-content-body').innerHTML = '<p>Loading...</p>';
					// Ask GitHub each time rather than reuse the browser's copy.
					fetch(baseUrl + filename, { cache: 'no-cache' })
						.then(function(response) {
							if (!response.ok) throw new Error('Failed to load profile');
							return response.text();
						})
						.then(function(markdown) {
							var body = document.getElementById('profile-content-body');
							body.innerHTML = marked.parse(markdown);
							addHeadingIds(body);
							markBrand(body);
						})
						.catch(function(err) {
							document.getElementById('profile-content-body').innerHTML = '<p>Unable to load profile.</p>';
						});
				}

				// GitHub-style heading slugs, so a profile's own section links
				// (e.g. #24-mode-reporting, #7-forwarding--qos) resolve here too.
				function addHeadingIds(body) {
					var used = {};
					body.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function(heading) {
						var slug = heading.textContent.toLowerCase().trim()
							.replace(/[^\p{L}\p{N}_\- ]/gu, '')
							.replace(/ /g, '-');
						var id = used[slug] ? slug + '-' + used[slug] : slug;
						used[slug] = (used[slug] || 0) + 1;
						heading.id = id;
					});
				}

				// Tabs with sub-tabs: [key, label, file] each, the first the default.
				var groups = {
					audio: [['basic', 'Basic', 'audio_basic.md'], ['extended', 'Extended', 'audio_extended.md']],
					video: [['basic', 'Basic', 'video_basic.md'], ['extended', 'Extended', 'video_extended.md']],
					robotics: [['main', 'Main', 'robotics.md'], ['tscf', 'TSCF Streams', 'robotics_tscf.md']]
				};

				// The sub-tab last chosen. Audio and Video share theirs, so
				// switching between them keeps Basic or Extended.
				var lastKey = 'basic';

				// A group's profile for the sub-tab last chosen, else its first.
				function groupFile(group) {
					var match = groups[group].filter(function(entry) { return entry[0] === lastKey; })[0];
					return (match || groups[group][0])[2];
				}

				// The group and sub-tab a profile belongs to, or null.
				function groupOf(file) {
					for (var group in groups) {
						var entry = groups[group].filter(function(entry) { return entry[2] === file; })[0];
						if (entry) return { group: group, key: entry[0] };
					}
					return null;
				}

				function hashFor(file) {
					return '#' + file.replace(/\.md$/, '');
				}

				// The profile named by the URL hash (e.g. #avb_lite, #audio_extended,
				// #robotics_tscf, or #video for its current sub-tab), or null.
				function fileFromHash() {
					var name = decodeURIComponent(location.hash.slice(1)).toLowerCase().replace(/-/g, '_');
					var file = name + '.md';
					if (groupOf(file)) return file;
					if (Object.prototype.hasOwnProperty.call(groups, name)) return groupFile(name);
					var found = null;
					document.querySelectorAll('.profile-tab[data-file]').forEach(function(tab) {
						if (tab.getAttribute('data-file') === file) found = file;
					});
					return found;
				}

				function selectProfile(file) {
					var place = groupOf(file);
					if (place) lastKey = place.key;
					document.querySelectorAll('.profile-tab').forEach(function(tab) {
						var tabGroup = tab.getAttribute('data-group');
						var current = place && tabGroup === place.group;
						if (tabGroup) tab.setAttribute('href', hashFor(current ? file : groupFile(tabGroup)));
						tab.classList.toggle('active', tabGroup ? !!current : tab.getAttribute('data-file') === file);
					});
					var subtabs = document.getElementById('profile-levels');
					subtabs.hidden = !place;
					subtabs.innerHTML = '';
					if (place) groups[place.group].forEach(function(entry) {
						var link = document.createElement('a');
						link.className = 'profile-level' + (entry[2] === file ? ' active' : '');
						link.href = hashFor(entry[2]);
						link.textContent = entry[1];
						subtabs.appendChild(link);
					});
					loadProfile(file);
				}

				// Section links scroll within the profile and leave the hash
				// naming the tab, so the URL stays one to share.
				document.getElementById('profile-content-body').addEventListener('click', function(e) {
					var link = e.target.closest('a[href^="#"]');
					if (!link) return;
					var target = document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
					if (!target) return;
					e.preventDefault();
					target.scrollIntoView({ behavior: 'smooth', block: 'start' });
				});

				// Only a hash naming a profile switches profiles.
				window.addEventListener('hashchange', function() {
					var file = fileFromHash();
					if (file) selectProfile(file);
				});

				selectProfile(fileFromHash() || 'audio_basic.md');
			</script>

	</body>
</html>
